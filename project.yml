name: Transcript
options:
  bundleIdPrefix: com.transcript
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  TranscriptCore:
    path: Packages/TranscriptCore
  FluidAudio:
    path: Packages/FluidAudioEvidence
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 2.29.3
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.29.1
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.1.6
  Textual:
    url: https://github.com/gonzalezreal/textual
    exactVersion: 0.3.1

targets:
  TranscriptMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: MacApp
      - path: Shared/Pairing
      - path: Shared/Sync/MeetingCopyWire.swift
      - path: Shared/AutomaticSyncUI
      - path: App/Support/AutomaticSyncChannel.swift
      - path: App/Support/AutomaticSyncResourceChannel.swift
    dependencies:
      - package: TranscriptCore
        product: TranscriptCore
      - package: FluidAudio
        product: FluidAudio
      - package: MLXSwiftLM
        products: [MLXLLM, MLXLMCommon, MLXEmbedders]
      - package: MLXSwift
        product: MLX
      - package: Transformers
        product: Transformers
      - package: Textual
        product: Textual
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transcript.TranscriptMac
        PRODUCT_NAME: TranscriptMac
        INFOPLIST_FILE: MacApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacApp/TranscriptMac.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YUU54K6BSS
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES

  TranscriptMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: MacAppTests
      - path: Packages/TranscriptCore/Tests/TranscriptCoreTests/MigrationTests.swift
    dependencies:
      - target: TranscriptMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transcript.TranscriptMacTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YUU54K6BSS

  TranscriptMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: MacAppUITests
    dependencies:
      - target: TranscriptMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transcript.TranscriptMacUITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YUU54K6BSS

  Transcript:
    type: application
    platform: iOS
    sources:
      # Recursive: regenerate the ignored .xcodeproj after adding or removing App files.
      - path: App
      - path: Shared/Pairing
      - path: Shared/Sync
        excludes:
          - AutomaticSyncWire.swift
          - AutomaticSyncResourceWire.swift
      - path: Shared/AutomaticSyncUI
    dependencies:
      - package: TranscriptCore
        product: TranscriptCore
      - package: FluidAudio
        product: FluidAudio
      - target: TranscriptRecordingWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transcript.Transcript
        PRODUCT_NAME: Transcript
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Transcript.entitlements
        # Automatic + a team, so device builds get a real signature. The empty
        # manual identity that was here only ever worked on the Simulator.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YUU54K6BSS
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES

  TranscriptRecordingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
      - path: App/Support/RecordingActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transcript.Transcript.RecordingWidget
        PRODUCT_NAME: TranscriptRecordingWidget
        INFOPLIST_FILE: WidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/TranscriptRecordingWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YUU54K6BSS
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES

  TranscriptUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TranscriptUITests
      - path: App/Support/TestStorageConfiguration.swift
    dependencies:
      - target: Transcript
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transcript.TranscriptUITests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YUU54K6BSS
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  TranscriptTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Transcript
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transcript.TranscriptTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  TranscriptCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/TranscriptCore/Tests/TranscriptCoreTests
    dependencies:
      - package: TranscriptCore
        product: TranscriptCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transcript.TranscriptCoreTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  TranscriptMac:
    build:
      targets:
        TranscriptMac: all
        TranscriptMacTests: [test]
        TranscriptMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        TRANSCRIPT_MAC_TEST_RUN_ID: "$(TRANSCRIPT_MAC_TEST_RUN_ID)"
      targets:
        - TranscriptMacTests
        - TranscriptMacUITests
    archive:
      config: Release

  TranscriptTests:
    build:
      targets:
        Transcript: all
        TranscriptTests: [test]
    test:
      config: Debug
      environmentVariables:
        TRANSCRIPT_UI_FIXTURE: "0"
        TRANSCRIPT_TEST_STORAGE: "1"
        TRANSCRIPT_TEST_RUN_ID: "$(TRANSCRIPT_TEST_RUN_ID)"
      targets:
        - TranscriptTests
  TranscriptCore:
    build:
      targets:
        TranscriptCoreTests: [test]
    test:
      config: Debug
      targets:
        - TranscriptCoreTests
  Transcript:
    build:
      targets:
        Transcript: all
        TranscriptRecordingWidget: all
        TranscriptTests: [test]
        TranscriptUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        TRANSCRIPT_UI_FIXTURE: "0"
        TRANSCRIPT_TEST_STORAGE: "1"
        TRANSCRIPT_TEST_RUN_ID: "$(TRANSCRIPT_TEST_RUN_ID)"
      targets:
        - TranscriptUITests
        - TranscriptTests
    archive:
      config: Release
